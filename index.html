<!DOCTYPE html>
<html lang="en">
 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starbucks</title>
  <link rel="stylesheet" href="./styles/css/index.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
 
<body class="body">
  <header>
    <nav class="nav">
      <div class="container  flexbox flexbox--centered-spaced">  
      <a href="#">
        <img
          src="https://upload.wikimedia.org/wikipedia/en/thumb/d/d3/Starbucks_Corporation_Logo_2011.svg/1200px-Starbucks_Corporation_Logo_2011.svg.png"
          alt="Starbucks" width="48" height="48">
      </a>
      <ul class="list d-flex g-2">
        <li>
          <a href="#" class="link interactive">Menu</a>
        </li>
        <li>
          <a href="#" class="link interactive">New</a>
        </li>
        <li>
          <a href="#" class="link interactive">Contact</a>
        </li>
      </ul>
    </div>
    </nav>
  </header>
  <main>
    <article class="hero">
      <div class="container g-layout g-layout--center md:g-layout--1fr-1fr ">
        <div class="d-flex f-direction-column a-items-start ">
          <h1 class="hero__title">It's not just Coffee <br>
              It's <span class="c-primary">Starbucks</span></h1>
          <p class="hero__paragraph">
            Enjoy this summer with your favorite Shaken Espresso. Order it here. The summer favorite. A coffee full of
            flavor and freshness. Order it here.
          </p>
          <a href="#" class="link link--active interactive interactive--lg ">Order Now</a>
        </div>
        <img
          src="https://hips.hearstapps.com/delish/assets/15/28/1436214442-delish-chocolate-crunch-frappuccino-japan.png"
          alt="Starbucks" width="320" height="527">
      </div>
      <div class="social-media">
        <a href="#">
          <i class="bi bi-facebook"></i>
        </a>
        <a href="#">
          <i class="bi bi-twitter-x"></i>
        </a>
        <a href="#">
          <i class="bi bi-instagram"></i>
        </a>
    </article>
  </main>
</body>
 
</html>
